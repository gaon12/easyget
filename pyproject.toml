[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyget"
dynamic = ["version"]
description = "Fast, easy-to-use multi-platform file downloader with zero dependencies"
authors = [
    { name = "easyget-cli", email = "easyget@google.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/gaon12/easyget"

[project.scripts]
easyget = "easyget.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "easyget.__version__" }

[tool.setuptools.packages.find]
include = ["easyget*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "LOG", "PLW", "BLE", "S"]
ignore = [
    # Broad catches are intentional at the CLI/download error boundaries.
    "BLE001",
    # try/except/pass is deliberate in best-effort close and decode fallbacks.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108"]
